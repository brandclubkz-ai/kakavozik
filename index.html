<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Рейсы">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#EEF1EA">
<title>Рейсы</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1EA; --ink:#13231D; --ink2:#41534A; --mut:#5E6E67; --line:#D3DBD0; --field:#F6F8F3;
  --g:#13694B; --gd:#0C4B35; --gl:#DDEFE4; --am:#F2A900; --aml:#FFF0C9; --aink:#6B4200; --red:#B42318; --or:#B4400F;
  --font:'Onest',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:18px;line-height:1.35}
body{min-height:100vh;min-height:100dvh}
body.lock{overflow:hidden}
button,input{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none;text-align:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--am);outline-offset:2px}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none}
input[type=number]{-moz-appearance:textfield}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
#app{max-width:540px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 14px calc(40px + env(safe-area-inset-bottom))}
.mut{color:var(--mut)}

.hero{background:var(--g);color:#fff;border-radius:28px;padding:16px 18px 18px;margin-bottom:12px}
.when{font-size:17px;font-weight:600;opacity:.92}
.cnt{display:flex;align-items:flex-end;gap:14px;margin:8px 0 14px}
.cnt b{font-size:88px;font-weight:800;line-height:.86;letter-spacing:-.05em}
.cnt span{font-size:21px;font-weight:600;line-height:1.2;padding-bottom:4px}
.sums{display:grid;grid-template-columns:1fr 1fr;gap:10px;border-top:1.5px solid rgba(255,255,255,.22);padding-top:12px}
.sums small{display:block;font-size:15px;opacity:.82} .sums b{font-size:24px;font-weight:700;white-space:nowrap}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:58px;padding:0 18px;border-radius:18px;font-weight:700;font-size:18px;background:#fff;border:1.5px solid var(--line);color:var(--ink);text-align:center}
.btn.pri{background:var(--g);border-color:var(--g);color:#fff}
.btn.add{width:100%;min-height:78px;font-size:23px;font-weight:800;border-radius:24px;box-shadow:0 8px 22px rgba(19,105,75,.28);margin-bottom:10px}
.btn.dng{color:var(--red);border-color:#E6B3AD}
.btn.w{width:100%} .btn:active{transform:scale(.985)}
.btns{display:flex;gap:10px} .btns .btn{flex:1} .btns .btn.pri{flex:1.7}
.fuel{margin-bottom:14px}

.banner{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:18px;background:var(--aml);color:var(--aink);margin-bottom:12px;font-size:16px;font-weight:600;width:100%}
.banner>span:first-child{font-size:24px} .banner .btn{flex:none;min-height:44px;font-size:16px;padding:0 14px;background:var(--aink);border-color:var(--aink);color:#fff}

.sect{margin:18px 4px 8px;font-size:16px;font-weight:700;color:var(--ink2)}
.list{background:#fff;border:1.5px solid var(--line);border-radius:22px;padding:2px 12px;margin-bottom:10px}
.item{width:100%;display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1.5px solid var(--line);min-height:68px}
.item:last-child{border:none}
.ic{flex:none;width:46px;height:46px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:24px;background:var(--gl)}
.ic.f{background:#FFE7DC}
.item .nm{flex:1;min-width:0} .item .nm b{display:block;font-size:18px;font-weight:600;overflow-wrap:anywhere} .item .nm span{display:block;font-size:15px;color:var(--mut)}
.item .am{font-size:20px;font-weight:800;flex:none;white-space:nowrap}
.dayrow{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:60px;padding:8px 16px;background:#fff;border:1.5px solid var(--line);border-radius:18px;margin-bottom:8px;font-size:17px;font-weight:600}
.dayrow span:last-child{font-size:15px;color:var(--mut);font-weight:500;text-align:right}
.dayrow i{font-style:normal;display:inline-block;margin-left:6px;transition:transform .15s} .dayrow.open i{transform:rotate(90deg)}
.empty{text-align:center;padding:26px 18px;color:var(--mut);font-size:17px} .empty b{display:block;font-size:19px;color:var(--ink2);margin-bottom:4px}
.chip.on{background:var(--g);color:#fff;border-color:var(--g)}
.plan{background:#fff;border:1.5px solid var(--line);border-radius:22px;padding:6px 12px 10px;margin-bottom:10px}
.plan h3{font-size:19px;font-weight:700;margin:8px 2px 2px}
.pgrp{font-size:15px;font-weight:700;color:var(--mut);margin:10px 2px 0}
.prow{display:flex;align-items:center;min-height:66px;border-bottom:1.5px solid var(--line)}
.chk{flex:none;width:60px;height:64px;display:flex;align-items:center;justify-content:center}
.chk span{width:34px;height:34px;border-radius:50%;border:2.5px solid var(--g);display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;font-weight:800}
.prow.done .chk span{background:var(--g)}
.ptxt{flex:1;min-width:0;padding:8px 0;width:100%}
.ptxt b{display:block;font-size:18px;font-weight:600;overflow-wrap:anywhere} .ptxt span{display:block;font-size:15px;color:var(--mut)}
.prow.done .ptxt b{text-decoration:line-through;color:var(--mut)}
.padd{width:100%;min-height:54px;margin-top:10px;border:2px dashed var(--g);border-radius:16px;color:var(--g);font-weight:700;font-size:18px;text-align:center}
.pnone{padding:12px 2px;color:var(--mut);font-size:16px}
.order{background:#fff;border:2.5px solid var(--g);border-radius:24px;padding:14px 14px 14px;margin-bottom:12px}
.order.due{border-color:var(--am);background:var(--aml)}
.order .oh{font-size:16px;font-weight:700;color:var(--g)} .order.due .oh{color:var(--aink)}
.order .op{display:block;width:100%;font-size:24px;font-weight:800;letter-spacing:-.02em;margin:4px 0 2px;overflow-wrap:anywhere}
.order .os{font-size:17px;color:var(--ink2);margin-bottom:12px;min-height:4px}
.slide{position:relative;height:68px;border-radius:34px;background:var(--g);overflow:hidden;user-select:none;-webkit-user-select:none}
.slide.fin{background:var(--ink)}
.slbl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding-left:56px;color:#fff;font-size:19px;font-weight:700;pointer-events:none}
.knob{position:absolute;left:4px;top:4px;width:60px;height:60px;border-radius:50%;background:#fff;color:var(--g);font-size:28px;font-weight:800;display:flex;align-items:center;justify-content:center;touch-action:none;transition:transform .2s}
.slide.fin .knob{color:var(--ink)}
.send{background:#fff;border:1.5px solid var(--line);border-radius:22px;padding:16px;margin-top:22px}
.send h3{font-size:19px;font-weight:700} .send p{font-size:15px;color:var(--mut);margin:3px 0 12px}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom));z-index:300;background:var(--ink);color:#fff;padding:14px 18px;border-radius:16px;font-size:17px;font-weight:600;display:none;gap:16px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.3);max-width:92vw}
#toast button{color:var(--am);font-weight:800;font-size:17px;min-height:34px}

.ov{position:fixed;inset:0;z-index:100;background:rgba(10,24,18,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;border-radius:28px 28px 0 0;width:100%;max-width:540px;max-height:94dvh;overflow-y:auto;padding:12px 18px calc(24px + env(safe-area-inset-bottom));animation:up .2s ease-out}
.sheet::before{content:"";display:block;width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
.sheet h2{font-size:25px;font-weight:800;letter-spacing:-.025em;margin-bottom:14px}
@keyframes up{from{transform:translateY(36px);opacity:0}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.btn:active{transform:none}}
.fld{margin-bottom:14px} .fld>label{display:block;font-size:16px;font-weight:600;color:var(--ink2);margin-bottom:6px}
.inp{width:100%;min-height:58px;padding:0 15px;border-radius:16px;border:1.5px solid var(--line);background:var(--field);font-size:20px;min-width:0}
.inp.big{font-size:34px;font-weight:800;text-align:center;min-height:76px}
.inp::placeholder{color:#8B9992}
.two{display:grid;grid-template-columns:1.25fr 1fr;gap:10px} .two .fld{min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{min-height:46px;padding:0 16px;border-radius:23px;background:#fff;border:1.5px solid var(--line);font-size:17px;font-weight:600;display:inline-flex;align-items:center}
.err{color:var(--red);font-weight:600;font-size:16px;min-height:24px;margin-bottom:8px}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script>
"use strict";
const LS={get(k){try{return JSON.parse(localStorage.getItem(k))}catch{return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch{return false}}};
const KEY="reysy2-v1";
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const fmt=n=>new Intl.NumberFormat("ru-RU").format(Math.round(Math.abs(n||0)));
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const td=()=>iso(new Date());
const parse=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const dayLabel=s=>parse(s).toLocaleDateString("ru-RU",{weekday:"short",day:"numeric",month:"long"});
const fullDate=s=>parse(s).toLocaleDateString("ru-RU",{weekday:"long",day:"numeric",month:"long"});
const timeOf=ms=>new Date(ms).toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"});
const sum=(a,f=x=>x)=>a.reduce((s,x)=>s+(+f(x)||0),0);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const num=v=>{const n=parseFloat(String(v??"").replace(/\s/g,"").replace(",","."));return isNaN(n)?0:n};
const pl=(n,f)=>{n=Math.abs(n);const a=n%10,b=n%100;return f[(b>10&&b<20)?2:a===1?0:(a>=2&&a<=4)?1:2]};
const RJ=["рейс","рейса","рейсов"];

let D;
const ui={open:{},modal:null,reset:false,today:td()};
function load(){D=LS.get(KEY)||{};D.items=D.items||[];D.sentAt=D.sentAt||null;D.plans=D.plans||[];try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch{}}
function save(){if(!LS.set(KEY,D))toast("Не удалось сохранить: память телефона заполнена")}
const done=()=>{save();render()};

const trips=()=>D.items.filter(i=>i.type==="trip");
function recentPlaces(){const seen={},out=[];trips().sort((a,b)=>b.created-a.created).forEach(i=>{const k=(i.place||"").trim().toLowerCase();if(k&&!seen[k]){seen[k]=i;out.push(i)}});return out.slice(0,8)}
function topAmounts(){const m={};trips().forEach(i=>{m[i.amount]=(m[i.amount]||0)+1});return Object.entries(m).sort((a,b)=>b[1]-a[1]||b[0]-a[0]).slice(0,4).map(x=>+x[0]).sort((a,b)=>a-b)}
const unsent=()=>D.items.filter(i=>i.created>(D.sentAt||0));
function sendDue(){const u=unsent();if(!u.length)return 0;const first=Math.min(...u.map(i=>i.created)),days=Math.floor((Date.now()-first)/864e5);return days>=7?days:0}

const nowHM=()=>{const d=new Date();return pad(d.getHours())+":"+pad(d.getMinutes())};
const hm=ms=>{const d=new Date(ms);return pad(d.getHours())+":"+pad(d.getMinutes())};
const itime=i=>i.time||hm(i.created);
const isort=(a,b)=>itime(b).localeCompare(itime(a))||b.created-a.created;
const psort=(a,b)=>(a.time||"99:99").localeCompare(b.time||"99:99")||a.created-b.created;
function nextCard(t){
  const L=D.plans.filter(p=>p.date<=t&&!p.done).sort(psort);if(!L.length)return"";
  const p=L.find(x=>x.started)||L[0],go=!!p.started,timed=p.time&&p.date===t,due=!go&&(p.date<t||(timed&&p.time<=nowHM()));
  const head=go?`В пути с ${timeOf(p.started)}`:timed?(due?`Пора ехать, заказ на ${p.time}`:`Следующий заказ в ${p.time}`):p.date<t?`Не выполнен со ${dayLabel(p.date)}`:"Следующий заказ";
  return `<section class="order ${due?"due":""}" aria-label="Текущий заказ"><div class="oh">${head}</div><button class="op" data-a="editplan" data-v="${esc(p.id)}">${esc(p.place)}</button><div class="os num">${p.amount?fmt(p.amount)+" ₸":""}</div>
  <div class="slide ${go?"fin":""}" data-act="${go?"finish":"go"}" data-v="${esc(p.id)}"><span class="slbl">${go?"Проведите: выполнил":"Проведите: еду"}</span><button class="knob" aria-label="${go?"Выполнил":"Еду"}">${go?"✓":"»"}</button></div></section>`;
}
const tom=t=>{const d=parse(t);d.setDate(d.getDate()+1);return iso(d)};
function planRow(p,t){
  const late=!p.done&&p.date<t,sub=[late?"со "+dayLabel(p.date):"",p.time||"",p.started&&!p.done?"в пути":"",p.amount?fmt(p.amount)+" ₸":""].filter(Boolean).join(", ");
  return `<div class="prow ${p.done?"done":""}"><button class="chk" data-a="tick" data-v="${esc(p.id)}" aria-label="${p.done?"Вернуть в план":"Отметить выполненным"}"><span>${p.done?"✓":""}</span></button><button class="ptxt" data-a="editplan" data-v="${esc(p.id)}"><b>${esc(p.place)}</b>${sub?`<span>${sub}</span>`:""}</button></div>`;
}
function planBlock(t){
  const T=tom(t),vis=D.plans.filter(p=>p.date<=t?(!p.done||p.date===t):true).sort(psort);
  const g=(title,L)=>L.length?`<div class="pgrp">${title}</div>${L.map(p=>planRow(p,t)).join("")}`:"";
  const now=vis.filter(p=>p.date<=t),nxt=vis.filter(p=>p.date===T),later=vis.filter(p=>p.date>T);
  const dates=[...new Set(later.map(p=>p.date))].sort();
  return `<section class="plan" aria-label="План"><h3>План</h3>${vis.length?"":`<div class="pnone">Пока ничего не запланировано</div>`}${g("Сегодня",now)}${g("Завтра",nxt)}${dates.map(d=>g(dayLabel(d),later.filter(p=>p.date===d))).join("")}<button class="padd" data-a="newplan">＋ Добавить в план</button></section>`;
}
function row(i){
  const f=i.type==="fuel";
  return `<button class="item" data-a="edit" data-v="${esc(i.id)}"><span class="ic ${f?"f":""}">${f?"⛽":"🚛"}</span><span class="nm"><b>${esc(i.place||(f?"Заправка":"Рейс"))}</b><span>${itime(i)}${f&&i.liters?", "+fmt(i.liters)+" л":""}</span></span><span class="am num">${f?"−":""}${fmt(i.amount)} ₸</span></button>`;
}
function render(){
  const t=td(),tod=D.items.filter(i=>i.date===t).sort(isort),tt=tod.filter(i=>i.type==="trip");
  const pend=D.plans.filter(p=>p.date<=t&&!p.done).length,earned=sum(tt,i=>i.amount),fuel=sum(tod.filter(i=>i.type==="fuel"),i=>i.amount);
  const days={};D.items.forEach(i=>{if(i.date!==t)(days[i.date]=days[i.date]||[]).push(i)});
  const past=Object.keys(days).sort().reverse(),due=sendDue(),un=unsent().length;
  const sh=$(".sheet"),st=ui.reset?0:(sh?sh.scrollTop:0);ui.reset=false;
  document.body.classList.toggle("lock",!!ui.modal);
  $("#app").innerHTML=`<section class="hero" aria-label="Сегодня"><div class="when">Сегодня, ${fullDate(t)}</div>
    <div class="cnt"><b class="num">${tt.length}</b><span>${tt.length?pl(tt.length,RJ)+"<br>за сегодня":"рейсов пока<br>нет"}${pend?`<br><small style="font-size:15px;font-weight:500;opacity:.85">в плане ещё ${pend}</small>`:""}</span></div>
    <div class="sums"><div><small>Заработано</small><b class="num">${fmt(earned)} ₸</b></div><div><small>Топливо</small><b class="num">${fmt(fuel)} ₸</b></div></div></section>
  ${due?`<div class="banner"><span>📤</span><span style="flex:1">Данные не отправляли ${due} ${pl(due,["день","дня","дней"])}</span><button class="btn" data-a="send">Отправить</button></div>`:""}
  ${nextCard(t)}
  <button class="btn pri add" data-a="newtrip">＋ Записать рейс</button>
  ${planBlock(t)}
  <button class="btn w fuel" data-a="newfuel">⛽ Заправка</button>
  ${tod.length?`<div class="list">${tod.map(row).join("")}</div>`:`<div class="empty"><b>Сегодня записей нет</b>Нажмите «Записать рейс», когда выполните первый</div>`}
  ${past.length?`<div class="sect">Раньше</div>${past.map(d=>{const L=days[d].sort(isort),n=L.filter(i=>i.type==="trip").length,o=ui.open[d];
    return `<button class="dayrow ${o?"open":""}" data-a="day" data-v="${d}" aria-expanded="${!!o}"><span>${dayLabel(d)}</span><span>${n} ${pl(n,RJ)} · ${fmt(sum(L.filter(i=>i.type==="trip"),i=>i.amount))} ₸<i>›</i></span></button>${o?`<div class="list">${L.map(row).join("")}</div>`:""}`}).join("")}`:""}
  <div class="send"><h3>Отправить данные</h3><p>${D.sentAt?`Последний раз отправляли ${new Date(D.sentAt).toLocaleDateString("ru-RU",{day:"numeric",month:"long"})}. Новых записей: ${un}.`:`Ещё не отправляли. Записей: ${D.items.length}.`} Откроется список: выберите WhatsApp, Telegram или почту.</p><button class="btn pri w" data-a="send">📤 Отправить данные</button></div>
  ${ui.modal?`<div class="ov" data-a="close"><div class="sheet" role="dialog" aria-modal="true">${M[ui.modal.k](ui.modal)}</div></div>`:""}`;
  if(ui.modal){const n=$(".sheet");if(n)n.scrollTop=st}
}

const M={};
M.plan=m=>`<h2>${m.id?"В плане":"Новый рейс в плане"}</h2>
  <div class="fld"><label>Клиент или адрес</label><input class="inp" data-f="place" value="${esc(m.place||"")}" placeholder="Например, Айгуль или ул. Абая 5" autocomplete="off"></div>
  <div class="fld"><label>Когда</label><div class="chips" style="margin-top:0"><button class="chip ${m.date===td()?"on":""}" data-a="planday" data-v="today">Сегодня</button><button class="chip ${m.date===tom(td())?"on":""}" data-a="planday" data-v="tomorrow">Завтра</button></div><input class="inp" style="margin-top:8px" type="date" data-f="date" value="${esc(m.date)}"></div>
  <div class="fld"><label>Время, если назначено</label><input class="inp" type="time" data-f="time" value="${esc(m.time||"")}"></div>
  <div class="fld"><label>Сумма, если известна</label><input class="inp" type="number" inputmode="numeric" data-f="amount" value="${esc(m.amount||"")}" placeholder="0"></div>
  <p class="err" id="err"></p>
  <div class="btns">${m.id?`<button class="btn dng" style="flex:none" data-a="delplan">Удалить</button>`:`<button class="btn" data-a="close">Отмена</button>`}<button class="btn pri" data-a="saveplan">${m.id?"Сохранить":"Добавить"}</button></div>`;
M.done=m=>`<h2>Рейс выполнен</h2><p class="mut" style="margin:-6px 0 14px;font-size:18px">${esc(m.place)}</p>
  <div class="fld"><label>Сумма, ₸</label><input class="inp big num" type="number" inputmode="numeric" data-f="amount" value="${esc(m.amount||"")}" placeholder="0"></div>
  <p class="err" id="err"></p>
  <div class="btns"><button class="btn" data-a="close">Отмена</button><button class="btn pri" data-a="savedone">Готово</button></div>`;
M.trip=m=>{const pl_=m.id?[]:recentPlaces(),am=topAmounts();return `<h2>${m.id?"Рейс":"Новый рейс"}</h2>
  <div class="fld"><label>Сумма, ₸</label><input class="inp big num" type="number" inputmode="numeric" data-f="amount" value="${esc(m.amount||"")}" placeholder="0">${am.length?`<div class="chips">${am.map(a=>`<button class="chip" data-a="pickamt" data-v="${a}">${fmt(a)}</button>`).join("")}</div>`:""}</div>
  <div class="fld"><label>Клиент или адрес (если нужно)</label><input class="inp" data-f="place" value="${esc(m.place||"")}" placeholder="Например, Айгуль или ул. Абая 5" autocomplete="off">${pl_.length?`<div class="chips">${pl_.map(i=>`<button class="chip" data-a="pickplace" data-v="${esc(i.place)}">${esc(i.place)}</button>`).join("")}</div>`:""}</div>
  <div class="two"><div class="fld"><label>День</label><input class="inp" type="date" data-f="date" value="${esc(m.date)}"></div><div class="fld"><label>Время</label><input class="inp" type="time" data-f="time" value="${esc(m.time||"")}"></div></div>
  <p class="err" id="err"></p>
  <div class="btns">${m.id?`<button class="btn dng" style="flex:none" data-a="del">Удалить</button>`:`<button class="btn" data-a="close">Отмена</button>`}<button class="btn pri" data-a="saveitem">${m.id?"Сохранить":"Записать"}</button></div>`};
M.fuel=m=>`<h2>${m.id?"Заправка":"Заправка"}</h2>
  <div class="fld"><label>Сумма, ₸</label><input class="inp big num" type="number" inputmode="numeric" data-f="amount" value="${esc(m.amount||"")}" placeholder="0"></div>
  <div class="fld"><label>Сколько литров (если знаете)</label><input class="inp" type="number" inputmode="decimal" data-f="liters" value="${esc(m.liters||"")}" placeholder="0"></div>
  <div class="two"><div class="fld"><label>День</label><input class="inp" type="date" data-f="date" value="${esc(m.date)}"></div><div class="fld"><label>Время</label><input class="inp" type="time" data-f="time" value="${esc(m.time||"")}"></div></div>
  <p class="err" id="err"></p>
  <div class="btns">${m.id?`<button class="btn dng" style="flex:none" data-a="del">Удалить</button>`:`<button class="btn" data-a="close">Отмена</button>`}<button class="btn pri" data-a="saveitem">${m.id?"Сохранить":"Записать"}</button></div>`;

let toastT;
function toast(msg,act,fn){const t=$("#toast");t.innerHTML=`<span>${esc(msg)}</span>${act?`<button>${esc(act)}</button>`:""}`;t.style.display="flex";if(act)t.querySelector("button").onclick=()=>{t.style.display="none";fn()};clearTimeout(toastT);toastT=setTimeout(()=>t.style.display="none",act?7000:2800)}
const err=s=>{const e=$("#err");if(e)e.textContent=s};
const open=m=>{ui.modal=m;ui.reset=true;render()};
const syncModal=()=>{if(!ui.modal)return;document.querySelectorAll(".sheet [data-f]").forEach(el=>{ui.modal[el.dataset.f]=el.value})};
const isMobile=/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
function csvFile(){
  const q=s=>'"'+String(s??"").replace(/"/g,'""')+'"',L=D.items.slice().sort((a,b)=>a.date.localeCompare(b.date)||itime(a).localeCompare(itime(b))||a.created-b.created);
  const rows=[["День","Время","Что","Клиент или адрес","Сумма","Литры","Выехал"],...L.map(i=>[i.date,itime(i),i.type==="fuel"?"Заправка":"Рейс",i.place||"",i.amount,i.liters||"",i.started?timeOf(i.started):""])];
  return new Blob(["﻿"+rows.map(r=>r.map(q).join(";")).join("\r\n")],{type:"text/csv;charset=utf-8"});
}
const A={
  close(){ui.modal=null;render()},
  day(el){ui.open[el.dataset.v]=!ui.open[el.dataset.v];render()},
  newtrip(){open({k:"trip",date:td(),time:nowHM()})},
  newfuel(){open({k:"fuel",date:td(),time:nowHM()})},
  edit(el){const i=D.items.find(x=>x.id===el.dataset.v);if(i)open({k:i.type,id:i.id,amount:i.amount,place:i.place,liters:i.liters||"",date:i.date,time:itime(i)})},
  newplan(){open({k:"plan",date:td()})},
  planday(el){syncModal();ui.modal.date=el.dataset.v==="today"?td():tom(td());render()},
  editplan(el){const p=D.plans.find(x=>x.id===el.dataset.v);if(p)open({k:"plan",id:p.id,place:p.place,amount:p.amount||"",date:p.date,time:p.time||""})},
  saveplan(){syncModal();const m=ui.modal,pl_=(m.place||"").trim();
    if(!pl_){err("Укажите клиента или адрес");return}if(!m.date){err("Укажите день");return}
    const rec={place:pl_,amount:num(m.amount),date:m.date,time:m.time||""};
    if(m.id)Object.assign(D.plans.find(x=>x.id===m.id),rec);else D.plans.push(Object.assign({id:uid(),created:Date.now(),done:false,tripId:null},rec));
    ui.modal=null;done();toast(m.id?"Сохранено":"Добавлено в план")},
  delplan(){const i=D.plans.findIndex(x=>x.id===ui.modal.id);if(i<0)return;const [p]=D.plans.splice(i,1);ui.modal=null;done();toast("Удалено из плана","Вернуть",()=>{D.plans.splice(i,0,p);done()})},
  tick(el){const p=D.plans.find(x=>x.id===el.dataset.v);if(!p)return;
    if(!p.done){open({k:"done",planId:p.id,place:p.place,amount:p.amount||""});return}
    const ti=D.items.findIndex(x=>x.id===p.tripId),it=ti>=0?D.items.splice(ti,1)[0]:null;p.done=false;p.tripId=null;p.started=null;done();
    toast("Вернули в план","Отменить",()=>{if(it){D.items.push(it);p.tripId=it.id}p.done=true;done()})},
  savedone(){syncModal();const m=ui.modal,a=num(m.amount),p=D.plans.find(x=>x.id===m.planId);if(!p){A.close();return}
    if(!(a>0)){err("Введите сумму");return}
    const it={id:uid(),created:Date.now(),type:"trip",date:td(),time:nowHM(),place:p.place,amount:a,liters:0,planId:p.id,started:p.started||null};
    D.items.push(it);p.done=true;p.tripId=it.id;ui.modal=null;done();
    toast(`Записано: ${fmt(a)} ₸`,"Отменить",()=>{D.items=D.items.filter(x=>x.id!==it.id);p.done=false;p.tripId=null;done()})},
  pickamt(el){syncModal();ui.modal.amount=el.dataset.v;render()},
  pickplace(el){syncModal();const m=ui.modal,n=el.dataset.v,last=recentPlaces().find(i=>i.place===n);m.place=n;if(!num(m.amount)&&last)m.amount=last.amount;render()},
  saveitem(){syncModal();const m=ui.modal,a=num(m.amount);
    if(!(a>0)){err("Введите сумму");return}if(!m.date){err("Укажите день");return}
    const rec={type:m.k,date:m.date,time:m.time||nowHM(),place:m.k==="trip"?(m.place||"").trim():"",amount:a,liters:m.k==="fuel"?num(m.liters):0};
    if(m.id){Object.assign(D.items.find(x=>x.id===m.id),rec);ui.modal=null;done();toast("Сохранено");return}
    const it=Object.assign({id:uid(),created:Date.now()},rec);D.items.push(it);ui.modal=null;done();
    toast(`Записано: ${fmt(a)} ₸`,"Отменить",()=>{D.items=D.items.filter(x=>x.id!==it.id);done()})},
  del(){const i=D.items.findIndex(x=>x.id===ui.modal.id);if(i<0)return;const [it]=D.items.splice(i,1),pp=D.plans.find(p=>p.tripId===it.id);if(pp)pp.done=false;ui.modal=null;done();toast("Запись удалена","Вернуть",()=>{D.items.splice(i,0,it);if(pp)pp.done=true;done()})},
  async send(){
    if(!D.items.length){toast("Пока нечего отправлять");return}
    const blob=csvFile(),name=`reysy-${td()}.csv`;let ok=true;
    try{const f=new File([blob],name,{type:blob.type});
      if(isMobile&&navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f],title:"Рейсы",text:"Данные по рейсам"});
      else{const u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}}
    catch(e){if(e&&e.name==="AbortError")ok=false}
    if(ok){D.sentAt=Date.now();done();toast("Данные отправлены")}
  }
};
document.addEventListener("click",e=>{const el=e.target.closest("[data-a]");if(!el)return;if(el.classList.contains("ov")&&e.target!==el)return;const f=A[el.dataset.a];if(f)f(el)});
const S={
  go(id){const p=D.plans.find(x=>x.id===id);if(!p)return;p.started=Date.now();done();toast("В пути","Отменить",()=>{p.started=null;done()})},
  finish(id){const p=D.plans.find(x=>x.id===id);if(p)open({k:"done",planId:p.id,place:p.place,amount:p.amount||""})}
};
let drag=null;
const fire=s=>{const f=S[s.dataset.act];if(f)f(s.dataset.v)};
document.addEventListener("pointerdown",e=>{const k=e.target.closest(".knob");if(!k)return;const s=k.parentElement;drag={k,s,x:e.clientX,max:s.clientWidth-k.offsetWidth-8,dx:0};try{k.setPointerCapture(e.pointerId)}catch{}k.style.transition="none"});
document.addEventListener("pointermove",e=>{if(!drag)return;drag.dx=Math.max(0,Math.min(drag.max,e.clientX-drag.x));drag.k.style.transform=`translateX(${drag.dx}px)`;drag.s.querySelector(".slbl").style.opacity=1-drag.dx/drag.max});
const endDrag=()=>{if(!drag)return;const d=drag;drag=null;if(d.dx>d.max*.8){fire(d.s);return}d.k.style.transition="";d.k.style.transform="";d.s.querySelector(".slbl").style.opacity=1};
document.addEventListener("pointerup",endDrag);document.addEventListener("pointercancel",endDrag);
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.classList&&e.target.classList.contains("knob")){e.preventDefault();fire(e.target.parentElement)}});
setInterval(()=>{if(!ui.modal&&!drag)render()},30000);
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&ui.modal){ui.modal=null;render()}});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&td()!==ui.today){ui.today=td();render()}});
load();render();
if("serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost"))navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
